<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocketBase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="board-head">
        <div>
          <h1 class="board-title" id="greeting">Home</h1>
          <p class="board-sub" id="today"></p>
        </div>
        <div class="board-actions">
          <button class="btn btn--primary" id="new-idea">+ New idea</button>
        </div>
      </header>

      <div class="stats" id="stats"></div>

      <div class="home-grid">
        <!-- The card is the input. Type straight into it and press Enter; the
             fastest capture is the one with no screen in between. -->
        <div class="capture-card span-8" id="capture-card">
          <label class="sr-only" for="capture-input">Your idea</label>
          <textarea id="capture-input" class="capture-input" rows="1"
                    placeholder="Jot an idea&hellip;"></textarea>
          <div class="capture-foot">
            <span>Capture now, file it after</span>
            <span class="capture-foot-end">
              <span><span class="kbd">Ctrl</span> + <span class="kbd">&#9166;</span></span>
              <button class="btn btn--primary" id="evolve">Evolve my Ideas</button>
            </span>
          </div>
        </div>

        <section class="panel span-4">
          <div class="panel-head">
            <span class="caption">Inbox</span>
            <span class="badge" id="inbox-count">0</span>
            <i class="rule"></i>
          </div>
          <div id="inbox"></div>
        </section>

        <section class="panel span-8">
          <div class="panel-head">
            <span class="caption">Where you left off</span>
            <i class="rule"></i>
          </div>
          <div id="recent"></div>
        </section>

        <section class="panel span-4">
          <div class="panel-head">
            <span class="caption">Gathering dust</span>
            <i class="rule"></i>
          </div>
          <div id="dust"></div>
        </section>
      </div>
    </main>
  </div>

  <nav class="dock">
    <a href="index.html" class="active">Home</a>
    <a href="projects.html">Projects</a>
  </nav>

  <script type="module" src="js/home.js"></script>
</body>
</html>
