<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — PocketBase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="board">
      <header class="board-head">
        <div>
          <nav class="crumbs" id="crumbs"></nav>
          <h1 class="board-title" id="board-title">Projects</h1>
          <p class="board-sub" id="board-meta"></p>
        </div>
        <div class="board-actions">
          <button class="btn btn--secondary" id="new-folder">New folder</button>
          <button class="btn btn--primary" id="new-idea">+ New idea</button>
        </div>
      </header>

      <div id="projects-section">
        <div class="section-head">
          <span class="caption">All projects</span>
          <span class="badge" id="projects-count">0</span>
          <i class="rule"></i>
        </div>
        <div class="grid-boards" id="projects"></div>
      </div>

      <div id="folders-section">
        <div class="section-head">
          <span class="caption">Folders</span>
          <i class="rule"></i>
        </div>
        <div class="grid-boards" id="folders"></div>
      </div>

      <div id="docs-section">
        <div class="section-head">
          <span class="caption">Ideas</span>
          <span class="badge" id="docs-count">0</span>
          <i class="rule"></i>
        </div>
        <div class="grid-notes" id="documents"></div>
      </div>
    </main>
  </div>

  <nav class="dock">
    <a href="index.html">Home</a>
    <a href="projects.html" class="active">Projects</a>
  </nav>

  <script type="module" src="js/projects.js"></script>
</body>
</html>
